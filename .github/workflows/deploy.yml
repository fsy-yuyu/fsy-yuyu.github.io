name: 构建并部署博客

# 触发条件：推送到 main（或 master）分支，或在 Actions 页面手动点「Run workflow」
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 允许工作流写入 Pages、读取仓库内容
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务，新推送会排队而不是互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 锁定 Hugo 版本。主题要求 0.158.0+，不要随便改小。
      HUGO_VERSION: 0.158.0
    steps:
      - name: 安装 Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "${{ runner.temp }}/hugo.tar.gz" -C "${{ runner.temp }}"
          sudo mv "${{ runner.temp }}/hugo" /usr/local/bin/
          hugo version

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行会自动在仓库设置里启用 Pages（Source = GitHub Actions）
          enablement: true

      - name: 构建站点
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          # baseURL 由 Pages 自动注入，所以 hugo.toml 里不用写死你的域名
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
